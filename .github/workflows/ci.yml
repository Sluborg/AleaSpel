name: CI

# Checks every pull request the same way the deploy does (lint, format, art rules, build),
# so features can be reviewed on a branch before they reach main. The wake-bell PRs (draft PRs the
# sessions use as doorbells, never merged) are skipped by their exact branch names.
on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !contains(fromJSON('["art-wake", "lead-wake", "visuals-wake"]'), github.head_ref) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run validate:art
      - run: npm run build
